name: Keep AgroTech Services Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-api:
    name: Ping FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "API Status: %{http_code}\n" \
            --max-time 60 \
            https://api.agrotechintelligence.site/api/v1/ping || true

  ping-streamlit:
    name: Ping Streamlit Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "Streamlit Status: %{http_code}\n" \
            --max-time 60 \
            https://app.agrotechintelligence.site || true

  ping-telegram:
    name: Ping Telegram Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Reset Telegram Webhook
        continue-on-error: true
        run: |
          curl -s --max-time 30 \
            "https://api.agrotechintelligence.site/api/v1/telegram/set-webhook?webhook_url=https://api.agrotechintelligence.site" || true